<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Settings</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main>
      <section class="settings-group" aria-labelledby="general-heading">
        <h2 id="general-heading">General</h2>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-feature-icon setting-feature-icon-login" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13"></circle>
                <path d="M16 8.5v7"></path>
                <path d="M9.87 10.86A8 8 0 1 0 22.13 10.86"></path>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Start at login</strong>
              <small>Launch Pulse when you sign in.</small>
            </span>
          </span>
          <input id="start-at-login" type="checkbox" />
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <img
              class="setting-feature-icon"
              src="translation-icons/translate-icon.svg"
              alt=""
              aria-hidden="true"
            />
            <span class="setting-text">
              <strong>Live Translate</strong>
              <small>Add the Pulse microphone and show translation controls.</small>
              <small id="translation-lifecycle-status" class="lifecycle-status" hidden></small>
            </span>
          </span>
          <input id="translation-enabled" type="checkbox" />
        </label>
      </section>
      <section
        id="translation-section"
        class="settings-group"
        aria-labelledby="translation-heading"
        hidden
      >
        <h2 id="translation-heading">Live Translate</h2>
        <div class="translation-card">
          <div class="translation-row">
            <div class="translation-row-heading">
              <img
                class="translation-row-icon"
                src="translation-icons/key-icon-yellow.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="translation-row-copy">
                <strong>OpenAI API key</strong>
                <small id="api-key-status">Checking secure storage…</small>
              </span>
            </div>
            <div class="translation-row-controls key-controls">
              <div class="api-key-field">
                <input
                  id="openai-api-key"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="OpenAI API key"
                  placeholder="sk-…"
                />
                <span id="api-key-mask" class="api-key-mask" aria-hidden="true" hidden>************</span>
              </div>
              <div class="button-row">
                <button id="save-api-key" type="button">Save</button>
                <button id="remove-api-key" class="secondary-button" type="button" hidden>
                  Remove
                </button>
              </div>
            </div>
          </div>
          <div class="translation-row">
            <div class="translation-row-heading">
              <img
                class="translation-row-icon"
                src="translation-icons/microphone-icon-red.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="translation-row-copy">
                <strong>Microphone</strong>
                <small>Choose the microphone that will be used for translation.</small>
              </span>
            </div>
            <div class="translation-row-controls">
              <select
                id="translation-input-device"
                data-custom-select="audio"
                aria-label="Translation microphone"
              ></select>
            </div>
          </div>
        </div>
      </section>
      <section
        id="appearance-section"
        class="settings-group"
        aria-labelledby="appearance-heading"
        hidden
      >
        <h2 id="appearance-heading">Appearance</h2>
        <div class="setting-row schedule-row">
          <span class="setting-copy">
            <span class="setting-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13" fill="#00A6A6"></circle>
                <circle cx="16" cy="16" r="7" fill="none" stroke="#FFF" stroke-width="2.4"></circle>
                <path
                  d="M16 11.5V16l3.2 2.2"
                  fill="none"
                  stroke="#FFF"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.4"
                ></path>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Auto schedule</strong>
              <small>Choose when light and dark mode begin.</small>
            </span>
          </span>
          <div class="schedule-controls">
            <div class="time-selector">
              <span class="time-icon time-icon-light" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <circle cx="12" cy="12" r="3.25"></circle>
                  <path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.46 5.46l1.42 1.42M17.12 17.12l1.42 1.42M18.54 5.46l-1.42 1.42M6.88 17.12l-1.42 1.42"></path>
                </svg>
              </span>
              <select
                id="auto-light-start"
                data-custom-select="time"
                aria-label="Light mode start hour"
              ></select>
            </div>
            <div class="time-selector">
              <span class="time-icon time-icon-dark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M19.25 15.1A7.6 7.6 0 0 1 8.9 4.75a7.6 7.6 0 1 0 10.35 10.35Z"></path>
                </svg>
              </span>
              <select
                id="auto-dark-start"
                data-custom-select="time"
                aria-label="Dark mode start hour"
              ></select>
            </div>
          </div>
        </div>
      </section>
      <section id="tray-icon-section" class="settings-group" aria-labelledby="icon-heading" hidden>
        <h2 id="icon-heading">Tray icon</h2>
        <div class="setting-row">
          <span class="setting-copy">
            <span class="setting-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13" fill="#FF9500"></circle>
                <path
                  d="M16.1 7.2c-5.25 0-9.35 3.7-9.35 8.65 0 4.85 3.9 8.65 8.75 8.95 1.65.1 2.55-1.45 1.8-2.7-.55-.9.1-2.05 1.15-2.05h1.35c3.15 0 5.7-2.45 5.7-5.5 0-4.15-4.05-7.35-9.4-7.35Z"
                  fill="#FFF"
                ></path>
                <circle cx="11.3" cy="13.2" r="1.35" fill="#FF9500"></circle>
                <circle cx="15.7" cy="10.9" r="1.35" fill="#FF9500"></circle>
                <circle cx="20.4" cy="12.65" r="1.35" fill="#FF9500"></circle>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Icon style</strong>
              <small id="icon-description">Choose how Pulse appears in the system tray.</small>
            </span>
          </span>
          <select id="tray-icon" data-custom-select="icon" aria-label="Tray icon style">
            <option value="default">Default</option>
            <option value="red">Red</option>
          </select>
        </div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
