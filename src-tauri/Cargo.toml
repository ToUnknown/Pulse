[package]
name = "pulse"
version = "0.1.0"
description = "A small cross-platform tray utility"
authors = ["Pulse contributors"]
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

arboard = { version = "3", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAppearance", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSString", "block2", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
# CPU ONNX Runtime is linked into Pulse; users only download the two model files.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
paddle-ocr-rs = { version = "=0.6.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
winreg = "0.55"
