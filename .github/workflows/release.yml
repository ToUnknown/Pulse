name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to publish
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: pulse-release
  cancel-in-progress: false

jobs:
  plan-release:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      source_sha: ${{ github.sha }}

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: plan
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
        run: node .github/scripts/plan-release.mjs

      - name: Create draft release
        id: release
        if: ${{ steps.plan.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.plan.outputs.tag_name }}
        run: |
          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Pulse $TAG_NAME" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '.id'
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.name }}
    needs: plan-release
    if: ${{ needs.plan-release.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-release.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject release version
        env:
          RELEASE_VERSION: ${{ needs.plan-release.outputs.version }}
        run: node .github/scripts/apply-release-version.mjs

      - name: Validate updater configuration
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan-release.outputs.tag_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = require("./src-tauri/tauri.conf.json");
          const packageJson = require("./package.json");
          const cargoToml = fs.readFileSync("./src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];

          if (!config.plugins.updater.pubkey || config.plugins.updater.pubkey.startsWith("REPLACE_")) {
            throw new Error("Configure the updater public key before releasing.");
          }
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY) {
            throw new Error("Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing.");
          }
          if (config.version !== packageJson.version || config.version !== cargoVersion) {
            throw new Error("Injected package.json, Cargo.toml, and tauri.conf.json versions must match.");
          }
          if (process.env.RELEASE_TAG !== `v${config.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match app version v${config.version}.`);
          }
          NODE

      - name: Build and attach release files
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.plan-release.outputs.release_id }}
          tagName: ${{ needs.plan-release.outputs.tag_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-release:
    name: Publish release
    needs:
      - plan-release
      - build-release
    if: ${{ needs.plan-release.outputs.should_release == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-release.outputs.source_sha }}

      - name: Finalize public updater URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.plan-release.outputs.release_id }}
          EXCLUDED_PLATFORMS: windows-x86_64-msi
        run: node .github/scripts/finalize-updater-json.mjs

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.plan-release.outputs.release_id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              --silent; then
              exit 0
            fi

            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft' || true)" == "false" ]]; then
              exit 0
            fi

            if [[ "$attempt" == "5" ]]; then
              exit 1
            fi

            sleep $((attempt * 5))
          done

  cleanup-failed-release:
    name: Clean up failed release
    needs:
      - plan-release
      - build-release
      - publish-release
    if: >-
      ${{ always() &&
          needs.plan-release.outputs.should_release == 'true' &&
          needs.publish-release.result != 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Remove incomplete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.plan-release.outputs.release_id }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" == "true" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --silent
          fi
