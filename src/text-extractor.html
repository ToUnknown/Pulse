<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Text Extractor</title>
    <link rel="stylesheet" href="text-extractor.css" />
    <script type="module" src="text-extractor.js"></script>
  </head>
  <body data-phase="loading">
    <img id="screen" alt="" draggable="false" hidden />
    <div class="backdrop" aria-hidden="true"></div>
    <div id="selection-surface" aria-label="Drag to select text on your screen">
      <div id="selection" hidden></div>
    </div>
    <main id="result" role="dialog" aria-modal="true" aria-label="Text Extractor" tabindex="-1" hidden>
      <div id="capture-stage">
        <div id="extraction-mode" role="radiogroup" aria-label="Text recognition" data-mode="basic" hidden>
          <span class="mode-slider" aria-hidden="true"></span>
          <button id="mode-basic" type="button" role="radio" aria-checked="true" data-mode="basic">Basic</button>
          <button id="mode-advanced" type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="advanced">Advanced</button>
        </div>
        <div id="capture-frame"><img id="crop-image" alt="Selected screen area" draggable="false" /><div class="scan-shimmer" aria-hidden="true"></div></div>
      </div>
      <div id="result-details" hidden inert>
        <section class="text-panel" aria-label="Editable text">
          <textarea id="extracted-text" aria-label="Extracted text" spellcheck="false" dir="auto" disabled></textarea>
        </section>
        <div class="error-row" hidden><p id="extraction-error" role="alert"></p><button id="retry" class="quiet-button" type="button" hidden>Try again</button></div>
        <div class="result-actions">
          <div class="translate-control" hidden>
            <button id="translate" class="primary-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="languages" disabled><span class="translate-icon" aria-hidden="true"></span><span>Translate</span></button>
            <div id="languages" role="menu" aria-label="Translate into" hidden>
              <button type="button" role="menuitem" data-language="en">English</button>
              <button type="button" role="menuitem" data-language="uk">Українська</button>
              <button type="button" role="menuitem" data-language="de">Deutsch</button>
              <button type="button" role="menuitem" data-language="es">Español</button>
              <button type="button" role="menuitem" data-language="fr">Français</button>
              <button type="button" role="menuitem" data-language="it">Italiano</button>
              <button type="button" role="menuitem" data-language="pl">Polski</button>
              <button type="button" role="menuitem" data-language="pt">Português</button>
              <button type="button" role="menuitem" data-language="ja">日本語</button>
              <button type="button" role="menuitem" data-language="ko">한국어</button>
              <button type="button" role="menuitem" data-language="zh">简体中文</button>
              <button type="button" role="menuitem" data-language="ar">العربية</button>
            </div>
          </div>
          <button id="copy" class="primary-button" type="button" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="2"/><path d="M12 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h2"/></svg><span>Copy</span></button>
        </div>
      </div>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </main>
  </body>
</html>
