[package]
name = "pulse"
version = "0.1.0"
description = "A small cross-platform tray utility"
authors = ["Pulse contributors"]
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAppearance", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSString", "block2", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
