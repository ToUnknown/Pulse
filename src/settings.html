<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Settings</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main>
      <section class="settings-group" aria-labelledby="general-heading">
        <h2 id="general-heading">General</h2>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-feature-icon setting-feature-icon-login" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13"></circle>
                <path d="M16 8.5v7"></path>
                <path d="M9.87 10.86A8 8 0 1 0 22.13 10.86"></path>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Start at login</strong>
              <small>Launch Pulse when you sign in.</small>
            </span>
          </span>
          <input id="start-at-login" type="checkbox" />
        </label>
      </section>
      <section
        id="appearance-section"
        class="settings-group"
        aria-labelledby="appearance-heading"
        hidden
      >
        <h2 id="appearance-heading">Appearance</h2>
        <div class="setting-row schedule-row">
          <span class="setting-copy">
            <span class="setting-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13" fill="#00A6A6"></circle>
                <circle cx="16" cy="16" r="7" fill="none" stroke="#FFF" stroke-width="2.4"></circle>
                <path
                  d="M16 11.5V16l3.2 2.2"
                  fill="none"
                  stroke="#FFF"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.4"
                ></path>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Auto schedule</strong>
              <small>Choose when light and dark mode begin.</small>
            </span>
          </span>
          <div class="schedule-controls">
            <div class="time-selector">
              <span class="time-icon time-icon-light" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <circle cx="12" cy="12" r="3.25"></circle>
                  <path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.46 5.46l1.42 1.42M17.12 17.12l1.42 1.42M18.54 5.46l-1.42 1.42M6.88 17.12l-1.42 1.42"></path>
                </svg>
              </span>
              <select
                id="auto-light-start"
                data-custom-select="time"
                aria-label="Light mode start hour"
              ></select>
            </div>
            <div class="time-selector">
              <span class="time-icon time-icon-dark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M19.25 15.1A7.6 7.6 0 0 1 8.9 4.75a7.6 7.6 0 1 0 10.35 10.35Z"></path>
                </svg>
              </span>
              <select
                id="auto-dark-start"
                data-custom-select="time"
                aria-label="Dark mode start hour"
              ></select>
            </div>
          </div>
        </div>
      </section>
      <section id="tray-icon-section" class="settings-group" aria-labelledby="icon-heading" hidden>
        <h2 id="icon-heading">Tray icon</h2>
        <div class="setting-row">
          <span class="setting-copy">
            <span class="setting-feature-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="13" fill="#AF52DE"></circle>
                <path
                  d="M20.55 8.95a1.9 1.9 0 0 1 2.69 2.69l-7.08 7.08-2.69-2.69 7.08-7.08Z"
                  fill="#FFF"
                ></path>
                <path
                  d="M14.2 16.62c-1.57-.3-3.06.16-4.08 1.18-1.17 1.17-.64 2.74-2.07 4.17 2.43.53 4.61.05 5.79-1.13 1.02-1.02 1.41-2.49 1.06-4.03l-.7-.19Z"
                  fill="#FFF"
                ></path>
              </svg>
            </span>
            <span class="setting-text">
              <strong>Icon style</strong>
              <small id="icon-description">Choose how Pulse appears in the system tray.</small>
            </span>
          </span>
          <select id="tray-icon" data-custom-select="icon" aria-label="Tray icon style">
            <option value="default">Default</option>
            <option value="red">Red</option>
          </select>
        </div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
