<!doctype html>
<meta charset="utf-8">
<title>Advanced Access regression</title>
<style>body{margin:0;font:13px system-ui}iframe{width:100%;height:760px;border:0}button,pre{margin:12px}pre{white-space:pre-wrap}</style>
<button id="run">Run access checks</button><pre id="results">Ready</pre>
<iframe title="Actual Pulse Settings"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const output = document.querySelector('#results');
const source = await (await fetch('../../../src/settings.html')).text();
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function openFixture(installed=true, available=true, provider='api', configured=true) {
  const setup = `
    let provider=${JSON.stringify(provider)}, installed=${installed}, available=${available}, configured=${configured}, dictationEnabled=false;
    window.__TAURI__={core:{invoke:async(name,args)=>{
      if(name==='settings_state')return {platform:'macos',trayIcon:null,autoSchedule:null};
      if(name==='dictation_settings')return {enabled:dictationEnabled,apiKeyConfigured:configured,microphone:true,accessibility:true};
      if(name==='set_dictation_enabled'){if(args.enabled&&!configured)throw new Error('API key required');dictationEnabled=args.enabled;return;}
      if(name==='set_text_extractor_provider'){provider=args.provider;return;}
      if(name==='refresh_text_extractor_codex'){available=true;return;}
      if(name==='save_openai_api_key'){configured=true;return;}
      if(name==='clear_openai_api_key'){configured=false;dictationEnabled=false;return;}
      if(name==='text_extractor_state'||name==='text_extractor_advanced_access')return {
        enabled:false,shortcut:'Alt+Shift+T',quickShortcut:'Control+Alt+Shift+T',
        apiKeyConfigured:configured,advancedProvider:provider,activeAdvancedProvider:provider,
        advancedAvailable:provider==='codex'?available:configured,
        codex:{installed,available,checking:false},captureAccess:{supported:true,granted:true}
      };
      return {};
    }}};`;
  const base = new URL('../../../src/',location.href);
  frame.srcdoc = source.replace('<head>', `<head><base href="${base}"><script>${setup}<\/script>`);
  await new Promise(resolve=>frame.onload=resolve);
  const doc = frame.contentDocument;
  for(let i=0;i<100 && doc.querySelector('#openai-key-section').hidden;i++)await wait(20);
  doc.querySelector('#tab-advanced').click();
  await wait(350);
  return doc;
}
document.querySelector('#run').onclick=async()=>{
  output.textContent='Running…';
  const checks=[], check=(ok,message)=>checks.push(`${ok?'PASS':'FAIL'}: ${message}`);
  let doc=await openFixture();
  const api=doc.querySelector('#openai-key-form'), codex=doc.querySelector('#codex-access'), toggle=doc.querySelector('#codex-enabled');
  check(api.parentElement===codex.parentElement && api.getBoundingClientRect().bottom<codex.getBoundingClientRect().bottom,'API first, Codex below in one card');
  check(!toggle.checked && !toggle.disabled,'available Codex is opt-in');
  toggle.click();await wait(80);
  check(toggle.checked && !api.hidden,'enabling Codex keeps API credentials visible');
  doc.querySelector('#openai-key-remove').click();await wait(80);
  check(toggle.checked && doc.querySelector('#openai-key-remove').hidden,'removing API key preserves Codex choice');
  doc.querySelector('#openai-api-key').value='fixture-key';
  api.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait(80);
  check(toggle.checked && !doc.querySelector('#openai-key-remove').hidden,'saving API key preserves Codex choice');
  toggle.click();await wait(80);
  check(!toggle.checked && !api.hidden,'disabling Codex returns to API');
  doc=await openFixture(true,false);
  check(doc.querySelector('#codex-enabled').disabled && !doc.querySelector('#codex-access-notice').hidden,'unavailable Codex cannot be enabled');
  doc.querySelector('#codex-access-retry').click();await wait(80);
  check(!doc.querySelector('#codex-enabled').disabled && doc.querySelector('#codex-access-notice').hidden,'retry restores available toggle');
  doc=await openFixture(true,false,'codex');
  const unavailable=doc.querySelector('#codex-enabled');
  check(unavailable.checked && !unavailable.disabled,'saved unavailable Codex can still be switched off');
  unavailable.click();await wait(80);
  check(!unavailable.checked && unavailable.disabled,'turning unavailable Codex off selects API');
  doc=await openFixture(false,false);
  check(doc.querySelector('#codex-access').hidden && !doc.querySelector('#openai-key-form').hidden,'absent Codex leaves API available');
  doc=await openFixture(true,true,'codex',false);
  const dictation=doc.querySelector('#dictation-enabled');
  check(dictation.disabled && !dictation.checked,'Codex subscription cannot unlock dictation without an API key');
  check(doc.querySelector('#dictation-description').textContent.includes('Add your OpenAI API key'),'missing-key explanation appears on dictation');
  doc.querySelector('#openai-api-key').value='fixture-key';
  doc.querySelector('#openai-key-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait(80);
  check(!dictation.disabled && !dictation.checked,'saving a key unlocks dictation without enabling it');
  dictation.click();await wait(80);
  check(dictation.checked,'dictation can be enabled with a saved key');
  doc.querySelector('#openai-key-remove').click();await wait(80);
  check(dictation.disabled && !dictation.checked,'removing the key disables dictation immediately');
  output.textContent=checks.join('\n');
};
await openFixture();
</script>
