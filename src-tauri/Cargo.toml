[package]
name = "pulse"
version = "0.1.0"
description = "A small cross-platform tray utility"
authors = ["Pulse contributors"]
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
base64 = "0.22"
cpal = "0.18"
futures-util = "0.3"
keyring = "4.1"
tempfile = "3"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
coreaudio-rs = "0.14"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAppearance", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSObjCRuntime", "NSOperation", "NSRunLoop", "NSString", "block2", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
