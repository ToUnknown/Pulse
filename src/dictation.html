<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Dictation</title>
  <link rel="stylesheet" href="dictation.css">
  <script type="module" src="dictation.js"></script>
</head>
<body data-phase="idle">
  <main id="dictation" aria-label="Live dictation">
    <div id="transcript" aria-live="off"><p id="words"></p></div>
    <div id="waveform-shell" aria-hidden="true"><canvas id="waveform"></canvas><span id="spinner"></span><span id="check">✓</span></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
